<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Flip Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- AUDIO -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- WELCOME SCREEN -->
<div id="welcome">
    <div class="welcome-box">
        <h2 class="welcome-title">Welcome to the Tech Memory Game</h2>
        <p class="welcome-subtitle">Get ready to match all the tech icons!</p>
        <div class="welcome-typing">Loading game...</div>
    </div>
</div>

<!-- MAIN GAME -->
<div class="page">
    <h1>Memory Card Flip Game</h1>
    <div class="game" id="game"></div>
    <div id="score">Matches: 0</div>
</div>

<!-- FIREWORKS -->
<div id="fireworks"></div>

<!-- BUTTON -->
<button id="stopBtn">Stop Fireworks</button>

<script src="script.js"></script>
</body>
</html>
